name: Go build and test
help: >-
  Generates, formats, lints, tests and builds a Go module. go:test writes the
  coverage profile pkg.cov; go:build writes bin/<name>-<goos>-<goarch>. Reads
  go.mod.

when:
  files:
    - go.mod

vars:
  name: $(basename $(realpath -s .))
  semver: $(git tag --sort=version:refname | tail -n 1 || true)
  image: titpetric/${{name}}

env:
  vars:
    CGO_ENABLED: 0
    GIT_TAG: $(git describe --tags --always --dirty 2>/dev/null || echo "dev")
    GIT_COMMIT: $(git rev-parse HEAD 2>/dev/null || true)
    GIT_TIME: $(git log -1 --format="format:%aI" 2>/dev/null || true)
    GIT_BRANCH: $(git rev-parse --abbrev-ref HEAD 2>/dev/null || true)
    GIT_MODIFIED: $(git status --porcelain 2>/dev/null | wc -l)

jobs:
  build:
    desc: "Build app"
    vars:
      matrix:
        goos: [linux]
        goarch: [amd64]
    steps:
      - for:
          - goos in matrix.goos
          - goarch in matrix.goarch
        env:
          vars:
            GOOS: ${{ goos }}
            GOARCH: ${{ goarch }}
            buildPath: $(if [ -f main.go ]; then echo .; elif [ -d cmd ]; then find cmd -maxdepth 2 -name 'main.go' -printf './%h\n' | head -1; else echo .; fi)
        detach: true
        run: go build -trimpath -ldflags="-X 'main.Version=${GIT_TAG}' -X 'main.Commit=${GIT_COMMIT}' -X 'main.CommitTime=${GIT_TIME}' -X 'main.Branch=${GIT_BRANCH}' -X 'main.Modified=${GIT_MODIFIED}'" -o bin/${{name}}-${GOOS}-${GOARCH} ${{buildPath}}

  setup:
    desc: "Install Go automation tooling"
    cmds:
      - go install github.com/titpetric/tools/splint/cmd/splint@main
      - go install github.com/titpetric/exp/cmd/go-fsck@main
      - go install gotest.tools/gotestsum@latest

  fmt:
    desc: "Format the code"
    steps:
      # One pass over a data model of the source: every import block grouped
      # and ordered, an import nothing reaches taken out, and an import a
      # name needs put in.
      - splint fix ./...
      - go mod tidy

  lint:
    desc: "Lint the code"
    passthru: true
    tty: true
    steps:
      # splint replaces gofsck and go-fsck lint: one pass over a data model of
      # the source, reporting layout, godoc, pairing and coverage findings.
      - splint ./... || true

  default:
    desc: "Go lifecycle"
    depends_on: [generate, fmt, lint, test, build]

  generate:
    desc: "Run go generate/fix"
    passthru: true
    tty: true
    steps:
      - go generate ./...
      - go fix ./...

  test:
    desc: "Run tests"
    passthru: true
    tty: true
    steps:
      # Package list last: gotestsum hands everything after -- to go test, and
      # -coverprofile writes nothing without a word of complaint when the list
      # precedes the flags. The profile is what `atkins cover` reports from.
      - gotestsum -- -count 1 -cover -coverpkg=./... -coverprofile=pkg.cov ./...
