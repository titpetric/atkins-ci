#!/usr/bin/env atkins
# Atkins: https://github.com/titpetric/atkins

name: Atkins project tests, build

vars:
  build:
    goarch: [arm64, amd64]

env:
  vars:
    GIT_COMMIT: $(git rev-parse HEAD)
    GIT_BRANCH: $(git rev-parse --abbrev-ref HEAD)
    GIT_TAG: $(git describe --tags --always --dirty 2>/dev/null || echo "no-tag")
    GIT_TIME: $(git log -1 --format="format:%aI")
    GIT_STATUS: $(git status --porcelain | wc -l)

jobs:
  default:
    desc: "Run everything needed"
    depends_on: fmt
    steps:
      - task: test:simple
      - task: test:docs

  setup:
    desc: "Install dev tools"
    steps:
      - task: go:setup templ:setup mdox:setup

  install:
    desc: "Install atkins"
    depends_on: fmt
    vars:
      goos: linux
    steps:
      - for: goarch in ${{build.goarch}}
        env:
          vars:
            CGO_ENABLED: 0
            GOOS: ${{ goos }}
            GOARCH: ${{ goarch }}
        run: go build -ldflags="-X 'main.Version=${GIT_TAG}' -X 'main.Commit=${GIT_COMMIT}' -X 'main.CommitTime=${GIT_TIME}' -X 'main.Branch=${GIT_BRANCH}'" -o bin/atkins-${GOOS}-${GOARCH} .
      - cmds:  # This implements a rename based self-update
          - cp -f ./bin/atkins-linux-$(dpkg --print-architecture) /usr/local/bin/atkins.new
          - mv -f /usr/local/bin/atkins /usr/local/bin/atkins.old
          - mv -f /usr/local/bin/atkins.new /usr/local/bin/atkins

  # splint reads the tree, go-fsck renders it. `go-fsck extract ./...` reads
  # one package where splint reads all 59, which truncated docs/api to two
  # files every time this ran.
  #
  # splint exits non-zero when a linter found something, which is a lint
  # result and not an extraction failure, hence the `|| true`. Its document
  # nests the package list under .Packages; go-fsck reads that list on its
  # own, so jq unwraps it.
  test:docs:
    desc: "Generate docs"
    steps:
      - defer: rm -f splint.json go-fsck.json
      - splint -include-sources -save ./... || true
      - go-fsck docs -i splint.json --split --out=docs/api --strip=github.com/titpetric
      - task: mdox:fmt
        vars:
          source: ./docs

  templ:
    desc: "Generate templ components"
    steps:
      - templ fmt ./server/web
      - templ generate -path ./server/web

  templ:setup:
    desc: "Install a-h/templ"
    interactive: true
    cmds:
      - go install github.com/a-h/templ/cmd/templ@latest

  fmt:
    desc: "Format the code"
    steps:
      # Generation comes first so the formatting below normalises its output
      # too: templ emits two single-line import statements that are merged
      # into one block, and generating afterwards would leave the committed
      # files permanently one format behind.
      - task: templ
      # go:fmt is splint fix and go mod tidy. One pass, so there is no order
      # to get wrong.
      - task: go:fmt
      - splint ./... || true

  test:simple:
    desc: "Simple go test with gotestsum (passthru)"
    passthru: true
    steps:
      # Packages go after the `--`. Before it, gotestsum drops every
      # go-test flag that follows them, and -coverprofile writes
      # nothing without a word of complaint.
      - tty: true
        cmd: gotestsum --hide-summary=skipped -- -count 1 -coverpkg=github.com/titpetric/atkins/... -coverprofile=coverage.out ./...

  test:cover:
    desc: "Run tests and report coverage"
    depends_on: test:simple
    passthru: true
    steps:
      - run: mkdir -p coverage
        quiet: true
      - go tool cover -func=coverage.out | summary coverfunc --json > ./coverage/merged.cov.json
      - go tool cover -func=coverage.out | summary coverfunc --packages
      - go tool cover -func=coverage.out | summary coverfunc --files
      - go tool cover -html=coverage.out -o ./coverage/coverage.html

  test:fixtures:
    desc: "Run test fixtures"
    depends_on: install
    cmds:
      - ./tests/detach.yml
      - ./tests/depends_on.yml
      - ./tests/root_jobs.yml
      - ./tests/stdin.yml
      - cat ./tests/stdin.yml | atkins

